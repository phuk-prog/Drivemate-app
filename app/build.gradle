plugins {
    id 'com.android.application'
}
android {
    namespace 'com.drivemate.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drivemate.android'
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 200013
        versionName '2.0.1'
    }
    // The map/zoom test variant installs alongside stable DriveMate.
    // The signed release variant retains the established update-compatible ID.
    buildTypes {
        debug {
            applicationIdSuffix '.mapzoom'
            versionNameSuffix '-mapzoom-test'
        }
    }
    // PMTiles archives already compress their own tile/index data. Keep the
    // bundled overview uncompressed in APK so MapLibre can seek by byte range.
    androidResources {
        noCompress += ['pmtiles']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
