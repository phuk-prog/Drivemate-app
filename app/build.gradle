plugins {
    id 'com.android.application'
}
android {
    namespace 'com.drivemate.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drivemate.android'
        minSdk 26
        targetSdk 34
        versionCode 100601
        versionName '1.6.1'
    }
    // Stage 1 test installs alongside the stable 1.6.1 app.
    // Only the debug variant gets this alternate ID; release settings remain unchanged.
    buildTypes {
        debug {
            applicationIdSuffix '.stage2'
            versionNameSuffix '-stage2-test'
        }
    }
    // PMTiles archives already compress their own tile/index data. Keep the
    // bundled overview uncompressed in APK so MapLibre can seek by byte range.
    androidResources {
        noCompress += ['pmtiles']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    testImplementation 'junit:junit:4.13.2'
}
