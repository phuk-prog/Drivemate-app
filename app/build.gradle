plugins {
    id 'com.android.application'
}
android {
    namespace 'com.drivemate.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drivemate.android'
        minSdk 26
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 200020
        versionName '2.1.5'
    }
    // The map/zoom test variant installs alongside stable DriveMate.
    // The signed release variant retains the established update-compatible ID.
    buildTypes {
        debug {
            applicationIdSuffix '.mapzoom'
            versionNameSuffix '-mapzoom-test'
        }
    }
    // PMTiles archives already compress their own tile/index data. Keep the
    // bundled overview uncompressed in APK so DriveMate can seek by byte range.
    androidResources {
        noCompress += ['pmtiles']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}

// Reviewed dependency lockfile is checked into source control.
dependencyLocking { lockAllConfigurations() }

// Restrict security overrides to AGP's host-side Unified Test Platform.
// These libraries are not packaged in the release APK. Regenerate the lock
// from Gradle and run the OSV and emulator gates before signing.
configurations.configureEach {
    if (name.startsWith('_internal-unified-test-platform-')) {
        resolutionStrategy.eachDependency { details ->
            def g = details.requested.group
            def n = details.requested.name
            if (g == 'com.google.guava' && n == 'guava') details.useVersion('33.8.0-jre')
            if (g == 'com.google.protobuf' && n == 'protobuf-java') details.useVersion('3.25.9')
            if (g == 'commons-io' && n == 'commons-io') details.useVersion('2.21.0')
            if (g == 'io.netty' && n.startsWith('netty-') && details.requested.version?.startsWith('4.1.')) {
                details.useVersion('4.1.141.Final')
            }
        }
    }
    // Same policy for AGP's host-side lint tool (build-time only, not packaged).
    if (name == 'androidLintTool') {
        resolutionStrategy.eachDependency { details ->
            def g = details.requested.group
            def n = details.requested.name
            if (g == 'com.google.guava' && n == 'guava') details.useVersion('33.8.0-jre')
            if (g == 'org.apache.commons' && n == 'commons-lang3') details.useVersion('3.18.0')
            if (g == 'org.apache.httpcomponents' && n == 'httpclient') details.useVersion('4.5.13')
            if (g == 'org.bouncycastle' && n == 'bcprov-jdk18on') details.useVersion('1.85')
            if (g == 'org.bouncycastle' && n == 'bcpkix-jdk18on') details.useVersion('1.84')
        }
    }
}
