name: Real map on-device offline routing proof
on:
  push:
    branches: ['feat/offline-routing-proof-20261124','feat/local-navigation-20261124','feat/drivemate-own-stack-20261124']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download checksum-pinned real map source from GitHub and create local graph
        run: python3 tools/prepare_offline_routing_pilot.py
      - name: Compile original DriveMate map tiles
        run: python3 tools/prepare_dmtiles_pilot.py
      - name: Verify actual UK PMTiles range access
        run: python3 tools/probe_drive_map_range.py
      - name: Fetch pinned world map
        run: python3 tools/fetch_pinned_map.py
      - name: Compile app and Android instrumentation
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run downloaded graph with Android disconnected
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_offline_routing_pilot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-routing-pilot-evidence
          path: |
            app/src/androidTest/assets/wells-routing.json
            offline-pilot-results/
          if-no-files-found: warn
