name: DriveMate Stage 1 isolated debug preview (no release)
on:
  push:
    branches:
      - dev/stage1-driving-display-20261123
permissions:
  contents: read
jobs:
  debug-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch verified map overview
        run: python3 tools/fetch_pinned_map.py
      - name: Run unit tests and assemble DEBUG only
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Ensure test APK cannot replace stable DriveMate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.drivemate.android.stage1'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'DriveMate Stage 1 Test'"
      - name: Upload distinct Stage 1 debug APK only
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-Stage1-test-debug-APK-not-for-release
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
