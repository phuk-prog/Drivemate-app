name: Sign validated DriveMate 1.7.7 display overhaul candidate

# Private candidate only. Never runs for pull requests or on main.
on:
  push:
    branches: [release/display-overhaul-signed-20261125]

permissions:
  contents: read

# Do not cancel an in-progress signing run.
concurrency:
  group: signed-display-overhaul-candidate
  cancel-in-progress: false

jobs:
  signed-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/display-overhaul-signed-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # All branches, so the version check below can see dev builds too.
          fetch-depth: 0

      - name: Verify candidate source is identical to the validated display overhaul
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e49d1406785d613cc73b9fe8fd7e2ea6e915da05"
          git diff --exit-code "e49d1406785d613cc73b9fe8fd7e2ea6e915da05" HEAD -- . ':!.github/workflows/display-overhaul-signed-candidate.yml'
          grep -Eq '^[[:space:]]*versionCode[[:space:]]+100707[[:space:]]*$' app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify actual UK road features and style layer compatibility
        run: python3 tools/verify_drive_map_roads.py
      - name: Reject blank map screenshots (regression fixtures)
        run: python3 tools/check_drive_map_pixels.py --self-test
      - name: Verify DriveMate Map UK archive supports safe partial downloads
        run: python3 tools/probe_drive_map_range.py
      - name: Fetch checksum-verified DriveMate world map (45 MB)
        run: python3 tools/fetch_pinned_map.py
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Decode privately stored signing key
        env:
          DRIVEMATE_KEYSTORE_BASE64: ${{ secrets.DRIVEMATE_KEYSTORE_BASE64 }}
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVEMATE_KEYSTORE_BASE64" || -z "$DRIVEMATE_SIGNING_PASSWORD" ]]; then
            echo 'Set DRIVEMATE_KEYSTORE_BASE64 and DRIVEMATE_SIGNING_PASSWORD in repo Actions secrets.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/drivemate-private"
          printf '%s' "$DRIVEMATE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"
          test -s "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"

      - name: Sign app using stable DriveMate owner certificate
        env:
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sign-release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12" \
            app/build/outputs/apk/release/DriveMate-update.apk

      - name: Verify expected DriveMate certificate
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$SIGNER"
          CERT="$("$SIGNER" verify --print-certs --min-sdk-version 26 \
            app/build/outputs/apk/release/DriveMate-update.apk | \
            sed -nE 's/^(V[0-9.]+ Signer:|Signer #[0-9]+) certificate SHA-256 digest: ([[:xdigit:]]+)$/\2/p' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          EXPECTED="9f11804f0c28f61be2588fc6e1663514cfcca6ad4da4e31e19e4186c029b1a38"
          if [[ "$CERT" != "$EXPECTED" ]]; then
            echo "Expected signing certificate fingerprint was not found." >&2
            echo "Signing certificate does not match the DriveMate v1.2 update certificate." >&2
            exit 1
          fi

      - name: Confirm the signed APK carries the expected version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGE="$("$AAPT" dump badging app/build/outputs/apk/release/DriveMate-update.apk | grep -m1 '^package:')"
          echo "$BADGE"
          EXPECTED="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          echo "$BADGE" | grep -F "name='com.drivemate.android'" >/dev/null
          echo "$BADGE" | grep -F "versionCode='$EXPECTED'" >/dev/null
          NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)"
          echo "$BADGE" | grep -F "versionName='$NAME'" >/dev/null

      - name: Name the APK after the app and its version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION"
          cp app/build/outputs/apk/release/DriveMate-update.apk "app/build/outputs/apk/release/DriveMate-$VERSION.apk"
          echo "DRIVEMATE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Signed APK: DriveMate-$VERSION.apk"

      - name: Upload privately signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-${{ env.DRIVEMATE_VERSION }}-display-overhaul-signed-APK
          path: app/build/outputs/apk/release/DriveMate-${{ env.DRIVEMATE_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/drivemate-private"
