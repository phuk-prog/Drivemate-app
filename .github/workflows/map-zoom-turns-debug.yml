name: DriveMate 1.7.0 RC2 camera, turns, detailed map validation
on:
  push:
    branches:
      - dev/map-zoom-turns-rc2-20261123
permissions:
  contents: read
jobs:
  map-turns-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify real UK road tiles and raster/vector source layout
        run: |
          python3 tools/verify_drive_map_roads.py
          python3 tools/verify_navigation_closeup.py
          python3 tools/check_drive_map_pixels.py --self-test
      - name: Fetch pinned world map archive
        run: python3 tools/fetch_pinned_map.py
      - name: Run all navigation, camera and other JVM tests; build DEBUG only
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify isolated debug build cannot replace stable DriveMate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk |
            grep -F "package: name='com.drivemate.android.zoom' versionCode='100701'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk |
            grep -F "application-label:'DriveMate Zoom Test'"
      - name: Upload development test APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-Zoom-Turns-RC2-isolated-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
