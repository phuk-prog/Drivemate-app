name: DriveMate verified signed release
on:
  workflow_dispatch:
concurrency:
  group: drivemate-publication
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    environment: drivemate-release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject obsolete release version
        run: |
          python3 tools/check_release_version.py --published
          python3 tools/check_map_lock.py
          python3 tools/verify_release_map_assets.py
          python3 tools/check-apk-distribution.py
          python3 tools/check-action-pins.py
          python3 -m unittest discover -s tools -p test_release_workflow.py -v
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          python3 - <<'PY'
          import json,os
          v=json.load(open("release/version.json"))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("VERSION="+v["versionName"]+"\nVERSION_CODE="+str(v["versionCode"])+"\n")
          PY

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Validate redesigned day and night style contracts
        run: |
          python3 tools/test_driving_styles.py
          python3 tools/test_unified_styles.py
      - name: Verify actual UK road features and style layer compatibility
        run: python3 tools/verify_drive_map_roads.py
      - name: Reject blank map screenshots (regression fixtures)
        run: python3 tools/check_drive_map_pixels.py --self-test
      - name: Verify DriveMate Map UK archive supports safe partial downloads
        run: python3 tools/probe_drive_map_range.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/assets/world-z0-6.pmtiles
          key: world-map-${{ hashFiles('tools/fetch_pinned_map.py') }}
      - name: Fetch checksum-verified DriveMate world map (45 MB)
        run: python3 tools/fetch_pinned_map.py
      - name: Compile pinned original DriveMate map pilot
        run: python3 tools/prepare_dmtiles_pilot.py
      - name: Compile full-detail Stockport region from pinned UK map
        run: |
          sudo apt-get update -qq && sudo apt-get install -y osmium-tool
          python3 tools/prepare_stockport_unified_app.py
      - name: Validate resolved dependencies before signing
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks > dependency-report.txt
          git diff --exit-code -- app/gradle.lockfile
          python3 tools/scan_dependencies.py app/gradle.lockfile
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Prepare and run offline instrumentation before private signing
        run: |
          python3 tools/prepare_offline_routing_pilot.py
          python3 tools/prepare_navigation_lab.py --drivemate-only
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline emulator acceptance gate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_offline_routing_pilot.sh && bash tools/run_unified_zoom_test.sh && bash tools/run_drivemate_replay.sh
      - name: Upload shared road zoom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Stockport-shared-geometry-zoom-evidence
          path: |
            offline-pilot-results/
            navigation-lab/evidence/
            unified-zoom-results/
            app/src/main/assets/dmtiles-stockport/alignment-report.json
            !**/*.apk
            !**/*.aab
            !**/*.apks
            !**/*.xapk
            !**/*.apkm
            !**/*.zip
          if-no-files-found: warn
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check installable release-candidate package and new version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-unsigned.apk |
            grep -F "package: name='com.drivemate.android' versionCode='$VERSION_CODE' versionName='$VERSION'"

      - name: Decode privately stored signing key
        env:
          DRIVEMATE_KEYSTORE_BASE64: ${{ secrets.DRIVEMATE_KEYSTORE_BASE64 }}
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVEMATE_KEYSTORE_BASE64" || -z "$DRIVEMATE_SIGNING_PASSWORD" ]]; then
            echo 'Set DRIVEMATE_KEYSTORE_BASE64 and DRIVEMATE_SIGNING_PASSWORD in protected Actions secrets.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/drivemate-private"
          printf '%s' "$DRIVEMATE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"
          test -s "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"

      - name: Sign app using stable DriveMate owner certificate
        env:
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sign-release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12" \
            app/build/outputs/apk/release/DriveMate-${{ env.VERSION }}-signed.apk

      - name: Verify expected DriveMate certificate
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$SIGNER"
          CERT="$("$SIGNER" verify --print-certs --min-sdk-version 26 \
            app/build/outputs/apk/release/DriveMate-${{ env.VERSION }}-signed.apk | \
            sed -nE 's/^(V[0-9.]+ Signer:|Signer #[0-9]+) certificate SHA-256 digest: ([[:xdigit:]]+)$/\2/p' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          EXPECTED="9f11804f0c28f61be2588fc6e1663514cfcca6ad4da4e31e19e4186c029b1a38"
          if [[ "$CERT" != "$EXPECTED" ]]; then
            echo "Expected signing certificate fingerprint was not found." >&2
            echo "Signing certificate does not match the DriveMate v1.2 update certificate." >&2
            exit 1
          fi

      - name: Stage only certificate-verified signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp "app/build/outputs/apk/release/DriveMate-$VERSION-signed.apk" "release-output/DriveMate-$VERSION-signed.apk"
          (cd release-output && sha256sum "DriveMate-$VERSION-signed.apk" > SHA256SUMS)
          python3 tools/write_release_evidence.py --directory release-output

      - name: Upload non-installable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DriveMate-${{ env.VERSION }}-release-evidence
          path: |
            release-output/SHA256SUMS
            release-output/release-manifest.json
            release-output/CHANGELOG.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified signed APK (one-hour cleanup target)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DriveMate-${{ env.VERSION }}-signed-apk-1h
          path: release-output/DriveMate-${{ env.VERSION }}-signed.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove transient signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/drivemate-private"
