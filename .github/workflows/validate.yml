name: Validate DriveMate Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: '8.9'
      - name: Verify wrapper and release identity
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          python3 tools/check_release_version.py
          python3 tools/check_map_lock.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/assets/world-z0-6.pmtiles
          key: world-map-${{ hashFiles('tools/fetch_pinned_map.py') }}
      - name: Verify actual UK road features and style layer compatibility
        run: python3 tools/verify_drive_map_roads.py
      - name: Reject blank map screenshots (regression fixtures)
        run: python3 tools/check_drive_map_pixels.py --self-test
      - name: Verify DriveMate Map UK archive supports safe partial downloads
        run: python3 tools/probe_drive_map_range.py
      - name: Fetch checksum-verified DriveMate world map (45 MB)
        run: python3 tools/fetch_pinned_map.py
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Verify committed dependency locks
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks > dependency-report.txt
          git diff --exit-code -- app/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lock-evidence
          path: |
            app/gradle.lockfile
            dependency-report.txt
            !**/*.apk
            !**/*.aab
            !**/*.apks
            !**/*.xapk
            !**/*.apkm
            !**/*.zip
          if-no-files-found: error
      - name: Build signed debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Build unsigned release APK for stable private signing
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Collect official Android APK signing utility
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -print | sort -V | tail -n 1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-apksigner-tool
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 30
