name: DriveMate Stage 2 verified data and isolated debug (no release)
on:
  push:
    branches:
      - dev/stage2-traffic-intelligence-20261123
permissions:
  contents: read
jobs:
  stage2-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate UK vector road layers and blank map regression fixtures
        run: |
          python3 tools/verify_drive_map_roads.py
          python3 tools/check_drive_map_pixels.py --self-test
      - name: Fetch verified world overview asset
        run: python3 tools/fetch_pinned_map.py
      - name: Compile, run JVM tests, build DEBUG only
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Confirm APK cannot replace stable app or Stage 1 preview
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.drivemate.android.stage2'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'DriveMate Stage 2 Test'"
      - name: Upload Stage 2 debug test APK only
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-Stage2-test-DEBUG-not-for-release
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
