name: Expire signed APK downloads and remove unapproved binaries
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-public-apks.yml', 'tools/remove-public-apks.sh', 'tools/apk_artifact_policy.py']
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      delete:
        description: Delete expired official APK artifacts and unapproved binaries (unchecked = report only)
        type: boolean
        default: false
        required: true
permissions:
  actions: write
  contents: write
concurrency:
  group: remove-public-apks
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && github.repository == 'phuk-prog/Drivemate-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce one-hour APK artifact cleanup target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DELETE_REQUESTED: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.delete == true }}
        run: |
          if [[ "$DELETE_REQUESTED" == true ]]; then
            bash tools/remove-public-apks.sh --delete
          else
            bash tools/remove-public-apks.sh --dry-run
          fi
