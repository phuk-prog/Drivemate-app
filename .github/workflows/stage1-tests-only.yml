name: DriveMate Stage 1 validation (tests only)
on:
  push:
    branches:
      - dev/stage1-driving-display-20261123
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate day and night vector styles
        run: |
          python3 tools/verify_drive_map_roads.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets")
          day = json.loads((root / "drivemate_vector_style.json").read_text())
          night = json.loads((root / "drivemate_vector_style_night.json").read_text())
          d = {layer["id"]: layer for layer in day["layers"]}
          n = {layer["id"]: layer for layer in night["layers"]}
          assert set(d) == set(n), "Night map must retain every validated road layer"
          assert n["uk-roads"]["paint"]["line-color"] != d["uk-roads"]["paint"]["line-color"]
          assert n["uk-street-labels"]["paint"]["text-color"] != d["uk-street-labels"]["paint"]["text-color"]
          assert night["sources"] == day["sources"], "Do not alter UK map tile sources"
          print("Day/night street layers and sources validated")
          PY
      - name: Reject blank map fixtures
        run: python3 tools/check_drive_map_pixels.py --self-test
      - name: Download checksum-verified world overview asset
        run: python3 tools/fetch_pinned_map.py
      - name: Compile app and run JVM unit tests (no APK packaging)
        run: gradle --no-daemon :app:testDebugUnitTest
