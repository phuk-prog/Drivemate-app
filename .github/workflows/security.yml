name: Dependency security and wrapper integrity
on:
  pull_request:
  push:
    branches: [main, 'feat/repository-consolidation-app']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve dependency graph and scan Maven versions using OSV
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks > dependency-report.txt
          python3 tools/scan_dependencies.py app/gradle.lockfile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-evidence
          path: |
            app/gradle.lockfile
            dependency-report.txt
            dependency-security.json
          if-no-files-found: warn
