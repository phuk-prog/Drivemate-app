name: Dependency security and wrapper integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Resolve dependency graph and scan Maven versions using OSV
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks > dependency-report.txt
          python3 tools/scan_dependencies.py app/gradle.lockfile
          git diff --exit-code -- app/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-security-evidence
          path: |
            app/gradle.lockfile
            dependency-report.txt
            dependency-security.json
          if-no-files-found: warn
