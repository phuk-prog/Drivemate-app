name: Extended navigation soak and display evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 0'
permissions:
  contents: read
concurrency:
  group: navigation-soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/assets/world-z0-6.pmtiles
          key: world-map-${{ hashFiles('tools/fetch_pinned_map.py') }}
      - name: Prepare pinned road fixtures
        run: |
          python3 tools/check_map_lock.py
          python3 tools/fetch_pinned_map.py
          python3 tools/prepare_offline_routing_pilot.py
          python3 tools/prepare_dmtiles_pilot.py
          sudo apt-get update -qq && sudo apt-get install -y osmium-tool
          python3 tools/prepare_stockport_unified_app.py
          python3 tools/prepare_navigation_lab.py --drivemate-only
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline and real UI replay
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_navigation_soak.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: navigation-soak-evidence
          path: |
            navigation-soak-results/
            navigation-lab/evidence/
            navigation-lab/trace.json
            !**/*.apk
            !**/*.aab
            !**/*.apks
            !**/*.xapk
            !**/*.apkm
            !**/*.zip
          if-no-files-found: warn
