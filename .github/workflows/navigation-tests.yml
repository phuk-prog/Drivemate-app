name: Navigation replay and map integration
on:
  pull_request:
  push:
    branches: [main, 'feat/repository-consolidation-app']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/world-z0-6.pmtiles
          key: world-map-${{ hashFiles('tools/fetch_pinned_map.py') }}
      - name: Prepare pinned road fixtures
        run: |
          python3 tools/check_map_lock.py
          python3 tools/fetch_pinned_map.py
          python3 tools/prepare_offline_routing_pilot.py
          python3 tools/prepare_dmtiles_pilot.py
          sudo apt-get update -qq && sudo apt-get install -y osmium-tool
          python3 tools/prepare_stockport_unified_app.py
          python3 tools/prepare_navigation_lab.py --drivemate-only
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline and real UI replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_offline_routing_pilot.sh && bash tools/run_unified_zoom_test.sh && bash tools/run_drivemate_replay.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-test-evidence
          path: |
            offline-pilot-results/
            unified-zoom-results/
            navigation-lab/evidence/
            navigation-lab/trace.json
            !**/*.apk
            !**/*.aab
            !**/*.apks
            !**/*.xapk
            !**/*.apkm
            !**/*.zip
          if-no-files-found: warn
