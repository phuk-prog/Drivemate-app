name: Resolve proposed host dependency upgrades
on:
  pull_request:
    paths: ['app/build.gradle', 'app/gradle.lockfile', 'build.gradle', '.github/workflows/dependency-lock-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lock-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proposed-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify wrapper
        run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Resolve exact new lock without committing or publishing
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks > dependency-report.txt
          git diff -- app/gradle.lockfile > dependency-lock.diff
          echo 'LOCKFILE-BEGIN'
          cat app/gradle.lockfile
          echo 'LOCKFILE-END'
          sha256sum app/gradle.lockfile
          python3 tools/scan_dependencies.py app/gradle.lockfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: proposed-dependency-lock
          path: |
            app/gradle.lockfile
            dependency-lock.diff
            dependency-report.txt
            dependency-security.json
          if-no-files-found: error
