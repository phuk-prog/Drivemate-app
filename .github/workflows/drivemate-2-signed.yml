name: DriveMate 2.0.0 RC13 signed independent navigation update APK

# Review-candidate signing only from the exact protected development branch.
# No pull_request trigger: signing secrets never run for PR-submitted code.
on:
  push:
    branches:
      - feat/drivemate-2-independent-20261124

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/drivemate-2-independent-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate redesigned day and night style contracts
        run: |
          python3 tools/test_driving_styles.py
          python3 tools/test_unified_styles.py
      - name: Verify actual UK road features and style layer compatibility
        run: python3 tools/verify_drive_map_roads.py
      - name: Reject blank map screenshots (regression fixtures)
        run: python3 tools/check_drive_map_pixels.py --self-test
      - name: Verify DriveMate Map UK archive supports safe partial downloads
        run: python3 tools/probe_drive_map_range.py
      - name: Fetch checksum-verified DriveMate world map (45 MB)
        run: python3 tools/fetch_pinned_map.py
      - name: Compile pinned original DriveMate map pilot
        run: python3 tools/prepare_dmtiles_pilot.py
      - name: Compile full-detail Stockport region from pinned UK map
        run: |
          sudo apt-get update -qq && sudo apt-get install -y osmium-tool
          python3 tools/prepare_stockport_unified_app.py
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Prepare and run offline instrumentation before private signing
        run: |
          python3 tools/prepare_offline_routing_pilot.py
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline emulator acceptance gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_offline_routing_pilot.sh && bash tools/run_unified_zoom_test.sh
      - name: Upload shared road zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stockport-shared-geometry-zoom-evidence
          path: |
            unified-zoom-results/
            app/src/main/assets/dmtiles-stockport/alignment-report.json
          if-no-files-found: warn
      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Check installable release-candidate package and new version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-unsigned.apk |
            grep -F "package: name='com.drivemate.android' versionCode='200012' versionName='2.0.0-rc13'"

      - name: Decode privately stored signing key
        env:
          DRIVEMATE_KEYSTORE_BASE64: ${{ secrets.DRIVEMATE_KEYSTORE_BASE64 }}
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVEMATE_KEYSTORE_BASE64" || -z "$DRIVEMATE_SIGNING_PASSWORD" ]]; then
            echo 'Set DRIVEMATE_KEYSTORE_BASE64 and DRIVEMATE_SIGNING_PASSWORD in repo Actions secrets.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/drivemate-private"
          printf '%s' "$DRIVEMATE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"
          test -s "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12"

      - name: Sign app using stable DriveMate owner certificate
        env:
          DRIVEMATE_SIGNING_PASSWORD: ${{ secrets.DRIVEMATE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sign-release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/drivemate-private/DriveMate-Signing-Key.p12" \
            app/build/outputs/apk/release/DriveMate-2.0.0-rc13-signed.apk

      - name: Verify expected DriveMate certificate
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$SIGNER"
          CERT="$("$SIGNER" verify --print-certs --min-sdk-version 26 \
            app/build/outputs/apk/release/DriveMate-2.0.0-rc13-signed.apk | \
            sed -nE 's/^(V[0-9.]+ Signer:|Signer #[0-9]+) certificate SHA-256 digest: ([[:xdigit:]]+)$/\2/p' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          EXPECTED="9f11804f0c28f61be2588fc6e1663514cfcca6ad4da4e31e19e4186c029b1a38"
          if [[ "$CERT" != "$EXPECTED" ]]; then
            echo "Expected signing certificate fingerprint was not found." >&2
            echo "Signing certificate does not match the DriveMate v1.2 update certificate." >&2
            exit 1
          fi

      - name: Upload privately signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-2.0.0-rc13-independent-privately-signed-APK
          path: app/build/outputs/apk/release/DriveMate-2.0.0-rc13-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/drivemate-private"
