name: Import reviewed dependency lock (one-time)
on:
  push:
    branches: [feat/repository-consolidation-app]
    paths: ['.github/workflows/import-reviewed-lock.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'phuk-prog/Drivemate-app' && github.ref == 'refs/heads/feat/repository-consolidation-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repository-consolidation-app
      - name: Import exact reviewed CI lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/lock-import"
          gh run download 45724290394 --repo "$GITHUB_REPOSITORY" --name dependency-lock-evidence --dir "$RUNNER_TEMP/lock-import"
          cd "$RUNNER_TEMP/lock-import"
          echo 'bc5c0ba940a4a6ec4a61e952cacc3eea563479370bcbf9ae75808a170d787ac5  app/gradle.lockfile' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/lock-import/app/gradle.lockfile" app/gradle.lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/gradle.lockfile
          git commit -m 'Commit reviewed Gradle dependency lock generated by CI'
          git push origin HEAD:refs/heads/feat/repository-consolidation-app
