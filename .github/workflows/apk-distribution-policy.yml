name: APK distribution safety
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'policy/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check-apk-distribution.py
      - run: python3 tools/check-action-pins.py
      - name: Test signed APK expiry policy
        run: python3 -m unittest discover -s tools -p test_apk_artifact_policy.py -v
      - name: Validate cleanup script syntax
        run: bash -n tools/remove-public-apks.sh
