name: Build DriveMate Android APK and unsigned release
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build unsigned release APK for stable private signing
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DriveMate-unsigned-release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Collect official Android APK signing utility
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -print | sort -V | tail -n 1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DriveMate-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
