name: Navigation Lab six-app synchronized offline replay
on:
  push:
    branches: ['feat/navigation-comparison-lab-20261124']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare immutable real map fixture
        run: |
          python3 tools/prepare_offline_routing_pilot.py
          python3 tools/prepare_dmtiles_pilot.py
          python3 tools/fetch_pinned_map.py
      - name: Generate shared GPS trace and verify reference APKs against signed F-Droid index
        run: python3 tools/prepare_navigation_lab.py
      - name: Prepare optional local reference maps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maptool ffmpeg
          maptool -i offline-pilot-work/wells-places-2026-11-19.osm navigation-lab/navitmap.bin || true
          # Download one official region for OsmAnd, not for redistribution.
          if curl -fL --retry 2 --max-time 240 --max-filesize 500000000 'https://download.osmand.net/download?standard=yes&file=Gb_england_south-west-england_europe_2.obf.zip' -o navigation-lab/osmand.zip; then
            python3 -c 'import zipfile,pathlib; z=zipfile.ZipFile("navigation-lab/osmand.zip"); [z.extract(i,"navigation-lab") for i in z.infolist() if i.filename.endswith(".obf") and "/" not in i.filename and i.file_size<1000000000]' || true
          fi
        continue-on-error: true
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Android replays
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash tools/run_navigation_lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-lab-evidence
          path: |
            navigation-lab/trace.json
            navigation-lab/packages.json
            navigation-lab/evidence/
          if-no-files-found: warn
          retention-days: 7
