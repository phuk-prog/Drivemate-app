name: Navigation Lab six-app synchronized offline replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Prepare immutable real map fixture
        run: |
          python3 tools/prepare_offline_routing_pilot.py
          python3 tools/prepare_dmtiles_pilot.py
          python3 tools/fetch_pinned_map.py
      - name: Validate APK filename and traversal regression tests
        run: python3 -m unittest discover -s tools -p test_navigation_lab_apk.py -v
      - name: Generate shared GPS trace and verify reference APKs against signed F-Droid index
        run: python3 tools/prepare_navigation_lab.py
      - name: Prepare optional local reference maps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maptool ffmpeg
          python3 -c 'import xml.etree.ElementTree as E; t=E.parse("offline-pilot-work/wells-places-2026-11-19.osm"); E.indent(t); t.write("navigation-lab/wells-normalized.osm",encoding="utf-8",xml_declaration=True)'
          maptool -i navigation-lab/wells-normalized.osm navigation-lab/navitmap.bin || true
          ls -lh navigation-lab/navitmap.bin || true
          # Download one official region for OsmAnd, not for redistribution.
          if curl -fL --retry 2 --max-time 240 --max-filesize 500000000 'https://download.osmand.net/download?standard=yes&file=Gb_england_south-west-england_europe_2.obf.zip' -o navigation-lab/osmand.zip; then
            python3 -c 'import zipfile,pathlib; z=zipfile.ZipFile("navigation-lab/osmand.zip"); [z.extract(i,"navigation-lab") for i in z.infolist() if i.filename.endswith(".obf") and "/" not in i.filename and i.file_size<1000000000]' || true
          fi
        continue-on-error: true
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Android replays
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash tools/run_navigation_lab.sh
      - name: Produce evidence-grounded comparison report
        if: always()
        run: |
          python3 tools/report_navigation_lab.py
          cat navigation-lab/evidence/comparison-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: navigation-lab-evidence
          path: |
            navigation-lab/trace.json
            navigation-lab/packages.json
            navigation-lab/evidence/
            !**/*.apk
            !**/*.aab
            !**/*.apks
            !**/*.xapk
            !**/*.apkm
            !**/*.zip
          if-no-files-found: warn
          retention-days: 7
